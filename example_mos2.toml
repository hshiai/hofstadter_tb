name = "mos2"

# k = k1*b1 + k2*b2.
band_path = '''
G    0.0                 0.0
K    0.6666666666666667  0.3333333333333333
M    0.5                 0.5
G    0.0                 0.0
Kp   0.3333333333333333  0.6666666666666667
'''
n_k = 360

# Reads mos2_tb.dat beside this TOML file. No a1, a2, tau, or hopping table is
# needed. mos2_wsvec.dat will also be used automatically if it is present.
[wannier90]
tag = "mos2"
hopping_tolerance = 1.0e-4

[hofstadter]
mode = "spectrum"
omp_num_threads = 6
dpi = 500

[hofstadter.band]
p = 1
q = 3
k_path = '''
0.0  0.0
0.0  1.0
1.0  1.0
'''
n_k = 50

[hofstadter.spectrum]
# Preview settings only; increase q_max and k_mesh carefully.
flux_min = 0.0
flux_max = 0.1
q_max = 199
k_mesh = [1, 1]
k_mesh_q1 = [9, 9]

energy_min = -3.0
energy_max = 0.5
n_min = 12.0
n_max = 18.0
